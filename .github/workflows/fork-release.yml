name: Fork Release

env:
  JCODE_CI: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'kleksar/jcode'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: jcode-linux-x86_64
            portable_linux: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: jcode-linux-aarch64
            portable_linux: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jcode-macos-aarch64
            portable_linux: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: jcode-macos-x86_64
            portable_linux: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Build release binary
        if: matrix.portable_linux == false
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ github.ref_name }}
        run: cargo build --locked --release -p jcode --bin jcode --target "${{ matrix.target }}"

      - name: Build portable Linux x86_64 binary
        if: matrix.portable_linux == true
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ github.ref_name }}
          JCODE_COMPAT_ARTIFACT: ${{ matrix.artifact }}
        run: scripts/build_linux_compat.sh dist

      - name: Verify binary
        if: matrix.portable_linux == false
        shell: bash
        run: target/${{ matrix.target }}/release/jcode --version

      - name: Verify portable Linux binary
        if: matrix.portable_linux == true
        shell: bash
        run: dist/${{ matrix.artifact }} --version

      - name: Package binary
        if: matrix.portable_linux == false
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/jcode" "dist/package/${{ matrix.artifact }}"
          chmod +x "dist/package/${{ matrix.artifact }}"
          tar -C dist/package -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'kleksar/jcode'
    name: Publish verified assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jcode-*
          path: artifacts

      - name: Require the complete macOS and Linux asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            jcode-linux-x86_64
            jcode-linux-aarch64
            jcode-macos-aarch64
            jcode-macos-x86_64
          )
          for name in "${expected[@]}"; do
            test -f "artifacts/$name/$name.tar.gz" || {
              echo "Missing release asset: $name.tar.gz" >&2
              exit 1
            }
          done

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -name '*.tar.gz' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | awk '{ path=$2; sub(/^.*\//, "", path); print $1 "  " path }' \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = 4
          cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find artifacts -type f -name '*.tar.gz' -print0)
          test "${#assets[@]}" = 4
          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" SHA256SUMS \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

      - name: Verify public release contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=(
            SHA256SUMS
            jcode-linux-x86_64.tar.gz
            jcode-linux-aarch64.tar.gz
            jcode-macos-aarch64.tar.gz
            jcode-macos-x86_64.tar.gz
          )
          actual="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          for name in "${expected[@]}"; do
            grep -qxF "$name" <<<"$actual" || {
              echo "Published release is missing $name" >&2
              exit 1
            }
          done
