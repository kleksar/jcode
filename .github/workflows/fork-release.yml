name: Fork Release

env:
  JCODE_CI: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# The fork's initial public binary contract is intentionally narrow: macOS
# Apple Silicon and Windows x64. Publish them atomically, so an incomplete
# release never becomes the installer "latest" release.
jobs:
  build-macos-aarch64:
    if: github.repository == 'kleksar/jcode'
    name: Build (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-release-aarch64-apple-darwin

      - name: Build release binary
        shell: bash
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ github.ref_name }}
        run: cargo build --locked --release -p jcode --bin jcode --target aarch64-apple-darwin

      - name: Verify binary
        shell: bash
        run: target/aarch64-apple-darwin/release/jcode --version

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/aarch64-apple-darwin/release/jcode dist/package/jcode-macos-aarch64
          chmod +x dist/package/jcode-macos-aarch64
          tar -C dist/package -czf dist/jcode-macos-aarch64.tar.gz jcode-macos-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: jcode-macos-aarch64
          path: dist/jcode-macos-aarch64.tar.gz
          if-no-files-found: error

  build-windows-x86_64:
    if: github.repository == 'kleksar/jcode'
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-release-x86_64-pc-windows-msvc

      - name: Build release binary
        shell: pwsh
        env:
          JCODE_RELEASE_BUILD: "1"
          JCODE_CI_BUILD: "1"
          JCODE_BUILD_SEMVER: ${{ github.ref_name }}
        run: cargo build --locked --release -p jcode --bin jcode --target x86_64-pc-windows-msvc

      - name: Verify binary
        shell: pwsh
        run: |
          & target/x86_64-pc-windows-msvc/release/jcode.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Built Windows binary failed to run --version' }

      - name: Verify Windows installer with local artifact
        shell: pwsh
        run: |
          & ./.github/scripts/verify_windows_install.ps1 `
            -ArtifactExePath target/x86_64-pc-windows-msvc/release/jcode.exe `
            -Version $env:GITHUB_REF_NAME

      - name: Stage binary for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/jcode.exe dist/jcode-windows-x86_64-unsigned.exe

      - uses: actions/upload-artifact@v4
        with:
          name: jcode-windows-x86_64-unsigned
          path: dist/jcode-windows-x86_64-unsigned.exe
          if-no-files-found: error

  publish:
    if: github.repository == 'kleksar/jcode'
    name: Publish the two verified assets
    needs: [build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jcode-macos-aarch64
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: jcode-windows-x86_64-unsigned
          path: artifacts/windows

      # This fork asset is deliberately unsigned. Its name, the README, and the
      # installer communicate that fact. SHA256SUMS is mandatory and verified
      # by the installer before it is activated.
      - name: Package, checksum, and publish the unsigned Windows asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/macos/jcode-macos-aarch64.tar.gz dist/
          cp artifacts/windows/jcode-windows-x86_64-unsigned.exe dist/
          tar -C dist -czf dist/jcode-windows-x86_64-unsigned.tar.gz jcode-windows-x86_64-unsigned.exe
          (
            cd dist
            sha256sum \
              jcode-macos-aarch64.tar.gz \
              jcode-windows-x86_64-unsigned.exe \
              jcode-windows-x86_64-unsigned.tar.gz > SHA256SUMS
          )
          gh release create "${GITHUB_REF_NAME}" \
            dist/jcode-macos-aarch64.tar.gz \
            dist/jcode-windows-x86_64-unsigned.exe \
            dist/jcode-windows-x86_64-unsigned.tar.gz \
            dist/SHA256SUMS \
            --verify-tag --latest --generate-notes --title "${GITHUB_REF_NAME}"
          actual="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          for asset in SHA256SUMS jcode-macos-aarch64.tar.gz jcode-windows-x86_64-unsigned.exe jcode-windows-x86_64-unsigned.tar.gz; do
            grep -qxF "$asset" <<<"$actual" || { echo "Published release is missing $asset" >&2; exit 1; }
          done
